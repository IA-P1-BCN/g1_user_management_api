name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-placeholder-secret
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4

      - name: Install go-task
        run: sh -c "$(curl --silent --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies from the lockfile
        run: task install

      - name: Lint (ruff)
        run: task lint

      - name: Tests (pytest)
        run: task test
